<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sanaya — Login</title>
  <meta name="description" content="Sanaya Vehicle Use Register — login" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#D9A226" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }
    .login-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .login-logo img { height: 40px; width: auto; display: block; }
    .login-logo-text { display: flex; flex-direction: column; }
    .login-title { font-size: 18px; font-weight: 700; margin: 0; color: var(--ink); }
    .login-kicker { font-size: 12.5px; color: var(--muted); }
    .hint-box {
      background: #FDF6E3;
      border: 1px solid #F3E6BE;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .hint-box strong { color: var(--ink); }
    .login-field { display: flex; flex-direction: column; gap: 6px; }
    .login-field input {
      font-size: 16px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #FCFBF9;
      color: var(--ink);
      width: 100%;
    }
    .login-actions { margin-top: 4px; }
    .login-btn {
      width: 100%;
      background: var(--rust);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
    }
    .login-btn:disabled { opacity: 0.6; }
    .password-row { position: relative; }
    .toggle-pw {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 12px;
      text-decoration: underline;
      padding: 4px 6px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="assets/logo.png" alt="Sanaya logo" />
        <div class="login-logo-text">
          <h1 class="login-title">Sanaya Vehicle Log</h1>
          <span class="login-kicker">Sign in to continue</span>
        </div>
      </div>

      <form id="login-form" novalidate>
        <label class="login-field">Username
          <input type="text" id="login-user" placeholder="Enter username" autocomplete="username" required autofocus />
        </label>
        <label class="login-field">Password
          <div class="password-row">
            <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" id="toggle-pw">Show</button>
          </div>
        </label>
        <div id="login-error" class="error-text" style="display:none;"></div>
        <div class="login-actions">
          <button type="submit" class="login-btn" id="login-btn">Sign in</button>
        </div>
      </form>

      <div style="text-align:center; margin:16px 0 6px;">
        <button type="button" id="show-register" style="background:none; border:none; color:var(--rust-deep); font-size:13px; font-weight:600; text-decoration:underline;">Create an account →</button>
      </div>

      <form id="register-form" novalidate style="display:none; border-top:1px solid var(--line); padding-top:16px; margin-top:6px;">
        <p style="font-size:13px; color:var(--muted); margin:0;">Create a new user account.</p>
        <label class="login-field">Full name
          <input type="text" id="reg-name" placeholder="e.g. Ahmed Al Hinai" maxlength="60" />
        </label>
        <label class="login-field">Choose username
          <input type="text" id="reg-user" placeholder="e.g. ahmed" autocomplete="username" maxlength="30" />
        </label>
        <label class="login-field">Choose password
          <div class="password-row">
            <input type="password" id="reg-pass" placeholder="min 4 characters" autocomplete="new-password" />
            <button type="button" class="toggle-pw" id="toggle-reg-pw">Show</button>
          </div>
        </label>
        <label class="login-field">Confirm password
          <input type="password" id="reg-pass2" placeholder="repeat password" />
        </label>
        <div id="reg-error" class="error-text" style="display:none;"></div>
        <div id="reg-success" class="success-text" style="display:none;"></div>
        <button type="submit" class="submit-btn" id="reg-btn" style="width:100%;">Create account</button>
        <button type="button" class="btn-secondary" id="hide-register" style="width:100%; margin-top:8px;">Back to sign in</button>
      </form>

      <p class="empty-text" style="margin-top:14px; font-size:12.5px; text-align:center;">
        Multi-device app — data synced via server.
      </p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    (function () {
      const form = document.getElementById("login-form");
      const userEl = document.getElementById("login-user");
      const passEl = document.getElementById("login-pass");
      const errorEl = document.getElementById("login-error");
      const btn = document.getElementById("login-btn");
      const toggle = document.getElementById("toggle-pw");

      // If already logged in, go to app
      if (window.SanayaAuth && SanayaAuth.isLoggedIn()) {
        location.replace("index.html");
      }

      toggle.addEventListener("click", () => {
        const isPw = passEl.type === "password";
        passEl.type = isPw ? "text" : "password";
        toggle.textContent = isPw ? "Hide" : "Show";
      });

      // Create account toggle
      const showReg = document.getElementById("show-register");
      const hideReg = document.getElementById("hide-register");
      const regForm = document.getElementById("register-form");
      const loginForm = document.getElementById("login-form");
      const regTogglePw = document.getElementById("toggle-reg-pw");
      const regPass = document.getElementById("reg-pass");
      showReg.addEventListener("click", ()=>{ regForm.style.display="flex"; regForm.style.flexDirection="column"; regForm.style.gap="14px"; loginForm.style.display="none"; showReg.style.display="none"; });
      hideReg.addEventListener("click", ()=>{ regForm.style.display="none"; loginForm.style.display="flex"; loginForm.style.flexDirection="column"; loginForm.style.gap="14px"; showReg.style.display="inline"; });
      if (regTogglePw) regTogglePw.addEventListener("click", ()=>{
        const isPw = regPass.type === "password";
        regPass.type = isPw ? "text" : "password";
        regTogglePw.textContent = isPw ? "Hide" : "Show";
      });
      regForm.addEventListener("submit", async (e)=>{
        e.preventDefault();
        const displayName = document.getElementById("reg-name").value.trim();
        const username = document.getElementById("reg-user").value.trim();
        const password = document.getElementById("reg-pass").value;
        const password2 = document.getElementById("reg-pass2").value;
        const errEl = document.getElementById("reg-error");
        const okEl = document.getElementById("reg-success");
        errEl.style.display="none"; okEl.style.display="none";
        if (!displayName || !username || !password) { errEl.textContent="Full name, username and password are required."; errEl.style.display="block"; return; }
        if (password !== password2) { errEl.textContent="Passwords do not match."; errEl.style.display="block"; return; }
        try {
          await SanayaAuth.register(username, password, displayName);
          okEl.textContent="Account created! You can now sign in.";
          okEl.style.display="block";
          regForm.reset();
          setTimeout(()=>{ hideReg.click(); document.getElementById("login-user").value = username; document.getElementById("login-user").focus(); okEl.style.display="none"; }, 900);
        } catch (err) {
          errEl.textContent = err.message || "Registration failed.";
          errEl.style.display="block";
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = userEl.value.trim();
        const password = passEl.value;
        errorEl.style.display = "none";

        if (!username || !password) {
          errorEl.textContent = "Username and password are required.";
          errorEl.style.display = "block";
          return;
        }

        btn.disabled = true;
        btn.textContent = "Signing in…";

        try {
          await SanayaAuth.login(username, password);
          const params = new URLSearchParams(location.search);
          const next = params.get("next");
          const dest = next && (next === "dashboard.html" || next === "index.html") ? next : "index.html";
          location.replace(dest);
        } catch (err) {
          errorEl.textContent = err.message || "Invalid username or password.";
          errorEl.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Sign in";
          passEl.value = "";
          passEl.focus();
        }
      });
    })();
  </script>
</body>
</html>
